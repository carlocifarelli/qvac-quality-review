# Human decisions land on main (usually by merging a triage PR) -> search
# upstream for duplicates and file the newly confirmed findings as issues in
# this repo. Idempotent: findings that already have an issue are skipped.
name: publish
on:
  push:
    branches: [main]
    paths: [state/overrides.json]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx src/cli.ts dedupe --human-confirmed
      - run: npx tsx src/cli.ts publish
      - name: Commit issue links back to state
        run: |
          git diff --quiet -- state && exit 0
          git config user.name "qvac-quality-review[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Record duplicate searches and issue links"
          git push
