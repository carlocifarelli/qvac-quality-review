# PROPOSED, not installed anywhere: the workflow the target repository (QVAC)
# would add to run the check on every pull request. It is not added to QVAC
# because the exercise forbids opening PRs there.
#
#  - rules on the changed files: deterministic, ~seconds, free, BLOCKING
#  - agent review + verify of the riskiest changed files (prMaxFiles):
#    minutes, ~$0.5-1 per file, ADVISORY, only when ANTHROPIC_API_KEY is set
#  - one sticky comment on the PR with the result
#
# Copy to .github/workflows/ in the target repo and pin TOOL_REF to a commit.
name: qvac-quality
on:
  pull_request:
    paths: ['packages/**/*.ts', 'packages/**/*.tsx', 'packages/**/*.js', 'packages/**/*.mjs', 'packages/**/*.cjs']
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: qvac-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TOOL_REPO: carlocifarelli/qvac-quality-review
  TOOL_REF: main # pin to a commit SHA
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_AGENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOL_REPO }}
          ref: ${{ env.TOOL_REF }}
          path: tool
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: tool
      - name: Install the agent CLI when a key is configured
        if: env.HAS_AGENT == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: qr pr
        id: qr
        working-directory: tool
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          agent=$([ -n "$ANTHROPIC_API_KEY" ] && echo "" || echo "--no-agent")
          set +e
          npx tsx src/cli.ts pr ../target --base "origin/${{ github.base_ref }}" $agent
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Comment on the PR
        working-directory: tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} -R ${{ github.repository }} --body-file results/PR.md --edit-last --create-if-none
      - name: Fail on untriaged rule hits
        if: steps.qr.outputs.exit != '0'
        run: exit 1
